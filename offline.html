<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a73e8">
<title>Offline — Meeting Transcriber</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0d1117; color:#e8ebf0; font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif; }
  .box { text-align:center; padding:32px; max-width:340px; }
  .box h1 { font-size:20px; margin:0 0 12px; color:#fff; }
  .box p { font-size:15px; line-height:1.6; color:#8a94a1; margin:0 0 20px; }
  button { background:#1a73e8; color:#fff; border:0; border-radius:12px;
           font-size:16px; padding:12px 28px; cursor:pointer; }
</style>
</head>
<body>
<div class="box">
  <h1>Offline</h1>
  <p>No internet connection. Your recording data is safe on this device.</p>
  <button onclick="location.reload()">Try again</button>
</div>
</body>
</html>
